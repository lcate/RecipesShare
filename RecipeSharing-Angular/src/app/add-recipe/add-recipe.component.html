<div class="container mt-3">
  <form [formGroup]="formGroup" (ngSubmit)="addRecipe()" class="recipe-form">
    <!-- Title -->
    <mat-card-title class="text-center mb-5">
      <h3 class="fw-bold">Add Recipe</h3>
    </mat-card-title>

    <!-- Recipe Name -->
    <div class="form-group mb-4">
      <label for="name" class="form-label"><b>Recipe Name</b></label>
      <input type="text" formControlName="name" id="name" class="form-control" placeholder="Enter recipe name" />
    </div>

    <!-- Recipe Image -->
    <div class="form-group mb-4">
      <label for="image" class="form-label"><b>Recipe Image</b></label>
      <app-upload class="float-right" (onUploadFinished)="uploadFinished($event)"></app-upload>
    </div>

    <!-- Meal Type -->
    <div class="form-group mb-4">
      <label for="mealType" class="form-label"><b>Meal Type</b></label>
      <mat-form-field appearance="outline" class="w-100">
        <mat-select formControlName="mealType">
          <mat-option *ngFor="let meal of mealTypes" [value]="meal.value">
            {{ meal.key }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Dietary Preferences -->
    <div class="form-group mb-4">
      <label for="dietaryPreferences" class="form-label"><b>Dietary Preferences</b></label>
      <mat-form-field appearance="outline" class="w-100">
        <mat-select formControlName="dietaryPreferences">
          <mat-option *ngFor="let preference of dietaryPreferencesList" [value]="preference.value">
            {{ preference.key }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Preparation Time -->
    <div class="form-group mb-4">
      <label for="preparationTime" class="form-label"><b>Preparation Time (minutes)</b></label>
      <input type="number" formControlName="preparationTime" id="preparationTime" class="form-control" placeholder="E.g., 30" />
    </div>

    <!-- Recipe Steps -->
    <div formArrayName="steps" class="form-group mb-5">
      <label for="steps" class="form-label"><b>Steps</b></label>
      <div *ngFor="let step of steps.controls; let i = index" [formGroupName]="i">
        <div class="d-flex align-items-center mb-3">
          <!-- Step Description Input -->
          <input formControlName="stepDescription" class="form-control step-input" placeholder="Step description" />

          <!-- Remove Step Button -->
          <button type="button" class="btn btn-danger ms-2 step-btn" (click)="removeStep(i)" *ngIf="steps.length > 1">-</button>

          <!-- Add Step Button -->
          <button type="button" class="btn btn-success ms-2 step-btn" (click)="addStep()" *ngIf="i === steps.length - 1">+</button>
        </div>
      </div>
    </div>

    <!-- Ingredients -->
<div formArrayName="ingredients" class="form-group mb-5">
  <label for="ingredients" class="form-label"><b>Ingredients</b></label>
  <div *ngFor="let ingredient of ingredients.controls; let i = index" [formGroupName]="i">
    <div class="d-flex align-items-center mb-3">
      <!-- Amount Input -->
      <input
        type="number"
        formControlName="amount"
        class="form-control me-2 w-25"
        placeholder="Amount"
        min="1"
      />

      <!-- Measurement Unit Dropdown -->
      <mat-form-field appearance="outline" class="me-2 w-25">
        <mat-select formControlName="unit" placeholder="Unit">
          <mat-option *ngFor="let unit of measurementUnits" [value]="unit.value">
            {{ unit.key }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Ingredient Autocomplete -->
      <mat-form-field appearance="outline" class="me-2 w-50">
        <mat-label>Select Ingredient</mat-label>
        <input
          type="text"
          matInput
          [matAutocomplete]="auto"
          formControlName="ingredientName"
          (input)="onIngredientInput(i, $event)"
          placeholder="Start typing ingredient name"
        />
        <mat-autocomplete
          #auto="matAutocomplete"
          (optionSelected)="onIngredientSelected(i, $event)">
          <mat-option *ngFor="let option of filteredIngredients" [value]="option.name">
            {{ option.name }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>


      <!-- Remove Ingredient Button -->
      <button
        type="button"
        class="btn btn-danger ms-2"
        (click)="removeIngredient(i)"
        *ngIf="ingredients.length > 1"
      >
        -
      </button>

      <!-- Add Ingredient Button -->
      <button
        type="button"
        class="btn btn-success ms-2"
        (click)="addIngredient()"
        *ngIf="i === ingredients.length - 1"
      >
        +
      </button>
    </div>
  </div>
</div>


    <!-- Appliance Types -->
    <div class="form-group mb-4">
      <label for="applianceTypes" class="form-label"><b>Appliance Types</b></label>
      <mat-form-field appearance="outline" class="w-100">
        <mat-select formControlName="applianceTypes" multiple>
          <mat-option *ngFor="let appliance of applianceTypes" [value]="appliance">
            {{ appliance.key }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Submit Button -->
    <div class="form-group text-center">
      <button type="submit" class="btn btn-primary submit-btn">Create Recipe</button>
    </div>
  </form>
</div>
