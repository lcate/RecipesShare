<div class="container mt-4">
  <mat-card class="p-3 shadow-sm rounded">
    <!-- Title -->
    <mat-card-title class="text-center mb-3">
      <h6 class="fw-bold">Edit Recipe</h6>
    </mat-card-title>

    <!-- Name Field -->
    <div class="form-group mb-3">
      <label for="name" class="form-label text-secondary small"><b>Recipe Name</b></label>
      <mat-form-field appearance="outline" class="w-100 mat-small-field">
        <mat-label>Recipe name</mat-label>
        <input matInput [(ngModel)]="name" placeholder="E.g., Spaghetti Bolognese">
      </mat-form-field>
    </div>

    <!-- Image Upload -->
    <div class="form-group mb-3">
      <label for="imageUpload" class="form-label text-secondary small"><b>Recipe Image</b></label>
      <!-- Image Preview -->
      <div *ngIf="imageToShow" class="mb-2">
        <img
          [src]="imageToShow"
          alt="Uploaded Recipe Image"
          class="img-thumbnail shadow-sm rounded"
          style="max-width: 150px; height: auto;">
      </div>
      <app-upload
        [btnTitle]="'Upload Image'"
        (onUploadFinished)="onImageUpload($event)">
      </app-upload>
    </div>

    <!-- Meal Type -->
    <div class="form-group mb-3">
      <label for="mealType" class="form-label text-secondary small"><b>Meal Type</b></label>
      <mat-form-field appearance="outline" class="w-100 mat-small-field">
        <mat-label>Meal type</mat-label>
        <mat-select [(ngModel)]="mealType">
          <mat-option *ngFor="let meal of mealTypes" [value]="meal.value">
            {{ meal.key }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Dietary Preferences -->
    <div class="form-group mb-3">
      <label for="dietaryPreferences" class="form-label text-secondary small"><b>Dietary Preferences</b></label>
      <mat-form-field appearance="outline" class="w-100 mat-small-field">
        <mat-label>Dietary preference</mat-label>
        <mat-select [(ngModel)]="dietaryPreferences">
          <mat-option *ngFor="let preference of dietaryPreferencesList" [value]="preference.value">
            {{ preference.key }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Preparation Time -->
    <div class="form-group mb-3">
      <label for="preparationTime" class="form-label text-secondary small"><b>Preparation Time</b> (minutes)</label>
      <mat-form-field appearance="outline" class="w-100 mat-small-field">
        <mat-label>Preparation time</mat-label>
        <input matInput type="number" [(ngModel)]="preparationTime" placeholder="E.g., 30">
      </mat-form-field>
    </div>

    <!-- Recipe Appliances -->
    <div class="form-group mb-3">
      <label for="appliances" class="form-label text-secondary small"><b>Recipe Appliances</b></label>
      <mat-form-field appearance="outline" class="w-100 mat-small-field">
        <mat-label>Select appliances</mat-label>
        <mat-select [(ngModel)]="selectedAppliances" multiple>
          <mat-option *ngFor="let appliance of applianceTypes" [value]="appliance.key">
            {{ appliance.key }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>



    <!-- Recipe Steps Editing -->
    <div class="form-group mb-3">
      <label for="recipeSteps" class="form-label text-secondary small"><b>Recipe Steps</b></label>
      <div *ngFor="let step of recipeSteps; let i = index" class="d-flex align-items-center mb-2">
        <mat-form-field appearance="outline" class="flex-grow-1 mat-small-field">
          <mat-label>Step {{ i + 1 }}</mat-label>
          <textarea matInput [(ngModel)]="recipeSteps[i]" placeholder="Describe this step"></textarea>
        </mat-form-field>

        <!-- Remove button styled as a red minus -->
        <button
          mat-icon-button
          color="warn"
          class="remove-btn ms-2"
          (click)="deleteStep(i)">
          <mat-icon>remove</mat-icon>
        </button>
      </div>

      <!-- Add New Step -->
      <div class="text-center mt-3">
        <button
          mat-raised-button
          color="primary"
          class="px-4 py-1 fw-bold shadow-sm small-btn"
          (click)="addStep()">
          Add Step
        </button>
      </div>
    </div>

    <!-- Save Button -->
    <div class="text-center mt-3">
      <button
        mat-raised-button
        color="primary"
        class="px-4 py-1 fw-bold shadow-sm small-btn"
        (click)="editRecipe()">
        Save
      </button>
    </div>
  </mat-card>
</div>
