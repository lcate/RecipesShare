<div class="container mt-5">
  <div class="row justify-content-center align-items-start">
    <!-- Left Profile Info -->
    <div class="col-md-4 text-center">
      <mat-card class="box shadow-sm p-3">
        <mat-card-header>
          <img
            [src]="createImgPath(user.profilePicture)"
            class="rounded-circle img-thumbnail mb-3"
            alt="User Avatar"
            width="150"
            height="150">
        </mat-card-header>
        <mat-card-title class="mt-3">
          <h4>{{ user.firstName }} {{ user.lastName }}</h4>
        </mat-card-title>
        <mat-card-subtitle class="text-muted mb-3">
          <strong>{{ user.email }}</strong>
        </mat-card-subtitle>
        <hr>
        <mat-card-content class="text-left">
          <p><strong>Phone Number:</strong> {{ user.phoneNumber }}</p>
          <p><strong>Joined:</strong>
            {{ user.joinDate | date }}
          </p>
        </mat-card-content>
      </mat-card>
    </div>

    <!-- Right Content Area -->
    <div class="col-md-8">
      <mat-card class="box shadow-sm p-4">
        <mat-card-title>
          <h5>Additional Details</h5>
        </mat-card-title>
        <hr>
        <mat-card-content>
          <div class="row">
            <div class="col-sm-6 mb-3">
              <strong>Address:</strong> {{ user.address }}
            </div>
            <div class="col-12">
              <strong>About Me:</strong>
              <p>{{ user.about }}</p>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
      <!-- Button below the second card -->
      <div class="d-flex justify-content-end mt-3">
        <button mat-stroked-button color="primary" (click)="editUserProfile()">
          Edit Profile
        </button>
      </div>
    </div>
  </div>
</div>
